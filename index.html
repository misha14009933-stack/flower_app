<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Каталог цветов</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🌸 Каталог букетов</h1>

<div class="catalog">
    <div class="card">
        <img src="https://images.unsplash.com/photo-1509042239860-f550ce710b93" alt="Розы">
        <h3>Букет роз</h3>
        <p class="price">2 500 ₽</p>
        <button>Заказать</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1524594154908-edd4621c3d5f" alt="Тюльпаны">
        <h3>Тюльпаны</h3>
        <p class="price">1 800 ₽</p>
        <button>Заказать</button>
    </div>

    <div class="card">
        <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946" alt="Пионы">
        <h3>Пионы</h3>
        <p class="price">3 200 ₽</p>
        <button>Заказать</button>
    </div>
</div>
 
</body>
</html>
