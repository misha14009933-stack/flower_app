<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Цветы Лета.</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
    <div class="order-form hidden" id="orderForm">
    <h2>Оформление заказа</h2>

    <input type="text" id="name" placeholder="Ваше имя">
    <input type="tel" id="phone" placeholder="Телефон">
    <textarea id="comment" placeholder="Комментарий к заказу"></textarea>

    <button id="confirmOrder">Подтвердить заказ</button>
</div>
<body>

<!-- HEADER -->
<header class="header">
    <div class="logo">Цветы Лета.</div>
    <div class="city">📍 Пермь</div>
</header>

<!-- MAIN CONTENT -->
<main class="content">

    <!-- CATEGORIES -->
    <div class="categories">
        <button class="cat active">Все</button>
        <button class="cat">Сеты</button>
        <button class="cat">Гвоздики</button>
        <button class="cat">Экзотика</button>
        <button class="cat">Ранункулюсы</button>
        <button class="cat">Хризантемы</button>
    </div>

    <!-- FILTERS -->
    <div class="filters">
        <span>Розовые</span>
        <span>Синие</span>
        <span>Фиолетовые</span>
        <span>Белые</span>
        <span>Зелёные</span>
        <span>Красные</span>
    </div>

    <!-- PRODUCTS -->
    <div class="products"></div>

</main>

<!-- BOTTOM MENU -->
<nav class="bottom">
    <div>☰ Меню</div>

    <div class="cart">
        🛒 Корзина
        <span class="badge-cart" id="cartCount">0</span>
    </div>

    <div>👤 Профиль</div>
    <div>ℹ️ О проекте</div>
</nav>

<!-- JS -->
<script src="app.js"></script>

</body>
</html>
